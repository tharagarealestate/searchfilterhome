<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Tharaga — Home Search</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --brand:#6e0d25;
      --brand-2:#8c1630;
      --cream:#f7efe7;
      --ink:#1b1b1b;
      --muted:#6b7280;
      --ring:rgba(110,13,37,.25);
    }

    *{ box-sizing:border-box }
    html,body{
      margin:0;
      padding:0;
      background:var(--cream);
      color:var(--ink);
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    .input, select{
      width:100%;
      padding:10px 12px;
      font-size:14px;
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:10px;
      outline:0;
      transition:.15s ease-in-out;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      font-weight:700;
      background:var(--brand);
      color:#fff;
      border:1px solid var(--brand);
      border-radius:10px;
      cursor:pointer;
      padding:10px 20px;
    }

    .home-shell{ padding:12px 16px; }
    .home-search-container{
      max-width:900px;
      margin:12px auto 10px;
      background:linear-gradient(180deg,#fff,#fdf9f7);
      border:1px solid #f0d9d9;
      border-radius:16px;
      padding:10px;
      box-shadow:0 4px 24px rgba(110,13,37,.16);
    }

    /* Desktop layout: City | Search | Button */
    .home-search-row{
      display:grid;
      grid-template-columns:180px 1fr 118px;
      align-items:stretch;
    }
    .home-input-wrap{ position:relative }
    .home-icon{
      position:absolute;
      left:12px; top:50%;
      transform:translateY(-50%);
      color:var(--muted);
    }
    .home-input{ padding-left:36px }

    /* ===== MOBILE COMPACT MODE ===== */
    @media (max-width:640px){
      .home-search-container {
        padding:6px;          /* compact padding */
        border-radius:12px;
        box-shadow:0 2px 12px rgba(110,13,37,.12);
      }
      .input, select { 
        font-size:13px; 
        padding:8px 10px;     /* smaller input padding */
      }
      .btn { 
        padding:8px 14px; 
        font-size:13px;
      }
      .home-search-row {
        grid-template-columns:30% 70%; /* city 30%, search 70% */
        gap:6px;
      }
      #homeSearchBtn {
        grid-column:1 / -1; 
        justify-self:center;
        margin-top:6px;
      }
    }
  </style>
</head>
<body>

  <main class="home-shell">
    <section class="home-search-container" aria-label="Property quick search">
      <div class="home-search-row">
        <select id="homeCity" class="home-seg" aria-label="Select city">
          <option value="" selected disabled>Select City</option>
          <option>Chennai</option>
          <option>Coimbatore</option>
          <option>Madurai</option>
        </select>

        <div class="home-input-wrap">
          <svg class="home-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input id="homeQuery" class="input home-input" placeholder="Search up to 3 localities or landmarks">
        </div>

        <button id="homeSearchBtn" class="btn" type="button">
          <span>Search</span>
        </button>
      </div>
    </section>
  </main>

</body>
</html>
