<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Tharaga — Home Search</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --brand:#6e0d25;
      --brand-2:#8c1630;
      --cream:#f7efe7;
      --ink:#1b1b1b;
      --muted:#6b7280;
      --ring:rgba(110,13,37,.25);
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      padding:0;
      background:var(--cream);
      color:var(--ink);
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    .input, select{
      width:100%;
      padding:10px 12px;
      font-size:14px;
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:10px;
      outline:0;
      transition:.15s ease-in-out;
    }
    .input:hover, select:hover{
      border-color:var(--brand);
      background:#fffafa;
      box-shadow:0 2px 6px rgba(110,13,37,.06);
    }
    .input:focus, select:focus{
      border-color:var(--brand);
      box-shadow:0 0 0 3px var(--ring);
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      font-weight:700;
      letter-spacing:.01em;
      background:var(--brand);
      color:#fff;
      border:1px solid var(--brand);
      border-radius:10px;
      cursor:pointer;
      padding:10px 20px;
      transition:.15s ease-in-out;
      white-space:nowrap;
    }
    .btn:hover{ filter:brightness(1.03) }
    .btn:active{ transform:translateY(1px) }

    .home-shell{ padding:12px 16px; }
    .home-search-container{
      max-width:900px;
      margin:12px auto 10px;
      background:linear-gradient(180deg,#fff,#fdf9f7);
      border:1px solid #f0d9d9;
      border-radius:16px;
      padding:10px;
      box-shadow:0 4px 24px rgba(110,13,37,.16);
      transition:transform .2s ease, box-shadow .2s ease;
    }
    .home-search-container:hover{
      transform:translateY(-2px);
      box-shadow:0 16px 36px rgba(110,13,37,.16);
    }
    .home-search-container:focus-within{
      box-shadow:0 0 0 3px var(--ring), 0 16px 36px rgba(110,13,37,.16);
    }

    /* Pill Row */
    .pill-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .filter-pill {
      flex: 1;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--brand);
      background: #fff;
      color: var(--brand);
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-pill.active {
      background: var(--brand);
      color: #fff;
    }
    .filter-pill:hover {
      background: var(--brand-2);
      color: #fff;
    }

    .home-search-row{
      display:grid;
      grid-template-columns:180px 1fr 118px;
      align-items:stretch;
      gap:0;
    }
    .home-seg{ border-radius:0 }
    .home-seg--left{ border-top-left-radius:10px; border-bottom-left-radius:10px }
    .home-seg--right{ border-top-right-radius:10px; border-bottom-right-radius:10px }
    .home-input{ border-left:none; border-right:none }

    .home-input-wrap{ position:relative }
    .home-icon{
      position:absolute;
      left:12px; top:50%;
      transform:translateY(-50%);
      color:var(--muted);
      pointer-events:none;
    }
    .home-input{ padding-left:36px }

    /* ✅ Mobile adjustments */
    @media (max-width:640px){
      .home-search-row {
        grid-template-columns: 30% 70%; /* city 30%, search 70% */
        gap: 8px;
      }
      #homeSearchBtn {
        grid-column: 1 / -1;    /* span full row */
        justify-self: center;   /* center horizontally */
        width: auto;            /* shrink to fit */
        margin-top: 8px;
      }
      .home-input {
        border-left: 1px solid #e5e7eb;
        border-right: 1px solid #e5e7eb;
      }
      .home-seg,
      .home-seg--left,
      .home-seg--right {
        border-radius: 10px;
      }
    }
  </style>
</head>
<body>

  <main class="home-shell">
    <section class="home-search-container" aria-label="Property quick search">
      
      <!-- Pill Row -->
      <div class="pill-row">
        <button class="filter-pill active" data-type="buy">Buy</button>
        <button class="filter-pill" data-type="rent">Rent</button>
        <button class="filter-pill" data-type="commercial">Commercial</button>
      </div>

      <div class="home-search-row">
        <select id="homeCity" class="home-seg home-seg--left" aria-label="Select city">
          <option value="" selected disabled>Select City</option>
          <option>Chennai</option>
          <option>Coimbatore</option>
          <option>Madurai</option>
        </select>

        <div class="home-in
